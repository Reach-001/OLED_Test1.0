# CMSIS-DAP 接口配置（已优化下载速度）
# 可通过定义 ADAPTER_SPEED / WORKAREASIZE 变量覆盖默认值
if { ![info exists WORKAREASIZE] } {
    set WORKAREASIZE 0x4000
}
if { ![info exists ADAPTER_SPEED] } {
    # 默认 10000kHz，兼顾速度与稳定性
    # 若调试器不稳定可降为 8000 或 4000
    set ADAPTER_SPEED 20000
}

adapter driver cmsis-dap
adapter speed $ADAPTER_SPEED

# CMSIS-DAP v2 由 OpenOCD 自动检测（日志中已显示 "Using CMSIS-DAPv2"）
# 无需手动启用，手动启用可能导致不支持该命令的编译版本报错

# 不依赖 SRST/nRST 硬件复位信号
reset_config none
