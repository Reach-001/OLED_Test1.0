# Generic CMSIS-DAP interface configuration.
# Defaults can be overridden before this file is sourced.
if { ![info exists DAP_SWD_ID] } {
    set DAP_SWD_ID 0x6ba02477
}
if { ![info exists WORKAREASIZE] } {
    set WORKAREASIZE 0x4000
}
if { ![info exists ADAPTER_SPEED] } {
    set ADAPTER_SPEED 20000
}

adapter driver cmsis-dap
adapter speed $ADAPTER_SPEED

# Do not depend on SRST/nRST.
reset_config none
